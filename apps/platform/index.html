<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reference shell for module boundaries, performance budgets, and measurement." />
    <title>Frontend Architecture & Performance Platform</title>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('platform-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (prefersLight) theme = 'light';
        } catch (error) {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,560;6..72,650&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
